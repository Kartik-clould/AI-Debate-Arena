<!DOCTYPE html>
<html>
<head>
    <title>AI Debate Arena</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>AI Debate Arena</h1>

        <p>Enter a topic and let two AI agents debate it.</p>

        <input
            type="text"
            id="topic"
            placeholder="Enter your debate topic"
        >

        <button id="debateButton">
            Start Debate
        </button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
